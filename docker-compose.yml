# Compose cho dev: chỉ chạy hạ tầng (Postgres, Redis, MinIO) — backend/frontend chạy local qua
# `pnpm dev` (hot reload), kết nối vào các service này qua port publish ở dưới (localhost).
# Chạy full stack đóng container kiểu production (build backend/frontend/nginx) thì thêm overlay
# docker-compose.prod.yml: `pnpm docker:prod:up` (xem package.json / README).
services:
  seq:
    image: datalust/seq:2026.1
    profiles: [observability]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${SEQ_ACCEPT_EULA:-N}
      SEQ_FIRSTRUN_NOAUTHENTICATION: 'true'
    ports:
      - '127.0.0.1:5341:80'
    volumes:
      - seq-data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - '${MAIL_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  minio:
    # image minio/minio trên Docker Hub bị khai tử (archived 2026-02, xoá 2026-09-11) — build thẳng
    # từ source qua git submodule vendor/minio thay vì phụ thuộc registry/mirror ngoài. Build đa nền
    # tảng bình thường (không còn giới hạn amd64-only như mirror cũ). Xem vendor/README.md.
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      # Build từ source (xem Dockerfile) không đóng gói sẵn `mc` — probe trực tiếp endpoint
      # health chính thức của MinIO server.
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  seq-data:
  postgres-data:
  redis-data:
  minio-data:
