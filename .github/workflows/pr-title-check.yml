name: Check PR Title Format

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-title:
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR Title Pattern
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.trim();

            // Format: Tên-MSSV: Mô tả
            // Ví dụ: NguyenVanA-2112345: Fix bug giao diện
            const regex = /^[a-zA-Z0-9]+-[0-9]+:\s+.+$/;

            if (!regex.test(title)) {
              core.setFailed(
                `❌ PR Title không đúng định dạng!\n\n` +
                `👉 Format bắt buộc: Tên-MSSV: Mô tả\n` +
                `👉 Ví dụ: NguyenVanA-2112345: Thêm giao diện trang chủ`
              );
            } else {
              console.log(`✅ PR Title hợp lệ: ${title}`);
            }
