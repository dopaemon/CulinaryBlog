name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR push liên tục: huỷ run cũ của cùng branch cho đỡ tốn runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (backend + frontend)
        run: pnpm lint

      - name: Typecheck (shared + backend + frontend)
        run: pnpm typecheck

      - name: Test (backend jest + frontend vitest)
        run: pnpm test

      - name: Build (backend + frontend)
        run: pnpm build
